<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Cartes · Minimalist French Flashcards</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            serif: ['Fraunces', 'serif'],
          },
          screens: {
            'xs': '380px',
            'ipadmini': '768px',
            'ipad': '820px',
            'landscape-mobile': { 'raw': '(max-height: 500px) and (orientation: landscape)' }
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --app-bg: #F2ECE4;
      --paper: #FAF8F4;
      --ink: #2C2830;
      --ink-soft: #635E6A;
      
      /* Vibrant Theme Saturated Colors */
      --theme-blue-sat: #4C599E;
      --theme-orange-sat: #E2A648;
      --theme-sage-sat: #6F947B;
      --theme-rose-sat: #C97782;

      /* Pastel Light Exterior Colors */
      --theme-blue-light: #EEF1F8;
      --theme-orange-light: #FDF5E6;
      --theme-sage-light: #EFF5F0;
      --theme-rose-light: #FAEEEE;

      /* Translucent Blob Backgrounds for Back Faces */
      --blob-translucent: rgba(255, 255, 255, 0.22);

      --shadow-sm: 0 4px 12px rgba(44, 40, 48, 0.05);
      --shadow-md: 0 12px 36px rgba(44, 40, 48, 0.12);
    }

    body {
      background-color: var(--app-bg);
      color: var(--ink);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    .fcard {
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      perspective: 1500px;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .fcard.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 32px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      border: 6px solid #FFFFFF;
    }

    .face.front {
      transform: rotateY(0deg);
      z-index: 2;
    }

    .face.back {
      transform: rotateY(180deg);
      z-index: 1;
    }

    /* BACK FACE: Saturated Backgrounds */
    .theme-blue { background-color: var(--theme-blue-sat); }
    .theme-orange { background-color: var(--theme-orange-sat); }
    .theme-sage { background-color: var(--theme-sage-sat); }
    .theme-rose { background-color: var(--theme-rose-sat); }

    /* FRONT FACE: Light Pastel Backgrounds */
    .theme-light-blue { background-color: var(--theme-blue-light); }
    .theme-light-orange { background-color: var(--theme-orange-light); }
    .theme-light-sage { background-color: var(--theme-sage-light); }
    .theme-light-rose { background-color: var(--theme-rose-light); }

    /* FRONT FACE: Saturated Center Blob Fills */
    .shape-saturated-blue { background-color: var(--theme-blue-sat) !important; }
    .shape-saturated-orange { background-color: var(--theme-orange-sat) !important; }
    .shape-saturated-sage { background-color: var(--theme-sage-sat) !important; }
    .shape-saturated-rose { background-color: var(--theme-rose-sat) !important; }

    /* BACK FACE: Translucent Blob Fills */
    .face.back .geo-shape {
      background-color: var(--blob-translucent);
    }

    /* Morphing Organic Shape Container */
    .geo-shape {
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      animation: morphingBlob 10s ease-in-out infinite alternate;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.06);
    }

    .geo-shape.shape-1 {
      border-radius: 54% 46% 62% 38% / 44% 56% 44% 56%;
    }
    .geo-shape.shape-2 {
      border-radius: 38% 62% 42% 58% / 52% 38% 62% 48%;
    }
    .geo-shape.shape-3 {
      border-radius: 48% 52% 32% 68% / 42% 68% 32% 58%;
    }
    .geo-shape.shape-4 {
      border-radius: 62% 38% 48% 52% / 58% 32% 68% 42%;
    }

    @keyframes morphingBlob {
      0% { transform: scale(1) rotate(0deg); }
      100% { transform: scale(1.06) rotate(12deg); }
    }

    .fcard.behind {
      transform: scale(0.95) translateY(14px) rotate(-1deg);
      opacity: 0.8;
      pointer-events: none;
      z-index: 10;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s;
    }

    .fcard.behind2 {
      transform: scale(0.9) translateY(28px) rotate(1deg);
      opacity: 0.4;
      pointer-events: none;
      z-index: 5;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s;
    }

    .fcard.entering {
      animation: cardEnter 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardEnter {
      from { transform: scale(0.92) translateY(20px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }

    .stamp {
      position: absolute;
      top: 24px;
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 99px;
      opacity: 0;
      pointer-events: none;
      z-index: 30;
      transition: opacity 0.1s ease;
    }
    .stamp.acquis {
      right: 24px;
      color: #1E4620;
      background-color: #E2F3E5;
    }
    .stamp.revoir {
      left: 24px;
      color: #611D24;
      background-color: #FCE8E9;
    }

    /* Tactile Control Buttons */
    .tactile-btn {
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 12px rgba(44, 40, 48, 0.06);
      background-color: #FFFFFF;
      touch-action: manipulation;
    }

    .tactile-btn:active {
      transform: scale(0.92);
      box-shadow: 0 2px 6px rgba(44, 40, 48, 0.03);
    }

    .btn-revoir {
      background-color: #FDF4F5;
      color: #D48A93;
      border: 1.5px solid rgba(212, 138, 147, 0.22);
    }

    .btn-flip {
      background-color: #FFFFFF;
      color: #635E6A;
      border: 1.5px solid rgba(99, 94, 106, 0.15);
    }

    .btn-acquis {
      background-color: #F1F7F3;
      color: #87A691;
      border: 1.5px solid rgba(135, 166, 145, 0.22);
    }
  </style>
</head>

<body class="h-dvh w-screen flex flex-col items-center justify-between p-3 xs:p-4 ipadmini:p-6 select-none overflow-hidden relative">

  <header class="w-full max-w-[340px] xs:max-w-[380px] ipadmini:max-w-[600px] ipad:max-w-[850px] flex items-center justify-between py-2 z-20 shrink-0 gap-2">
    <!-- Brand Logo -->
    <div class="brand font-serif font-semibold text-xl xs:text-2xl text-slate-800 tracking-tight flex items-center gap-1.5 select-none shrink-0">
      Car<em>tes</em>
      <span class="w-1.5 h-1.5 rounded-full bg-[#E38379]"></span>
    </div>

    <!-- Header Navigation Switcher -->
    <nav class="flex items-center bg-white/80 backdrop-blur-md p-1 rounded-full border border-slate-200/70 shadow-xs gap-0.5 shrink-0">
      <button id="tabStudy" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-full transition-all bg-slate-900 text-white shadow-xs">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="14" height="12" rx="2"></rect>
          <path d="M6 4h14a2 2 0 0 1 2 2v10"></path>
        </svg>
        <span>Étudier</span>
      </button>

      <button id="tabManage" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-full transition-all text-slate-500 hover:text-slate-800">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        <span>Ajouter</span>
      </button>
    </nav>
  </header>

  <main class="w-full max-w-[340px] xs:max-w-[380px] ipadmini:max-w-[600px] ipad:max-w-[850px] flex-grow flex flex-col justify-center overflow-visible py-1 xs:py-2">
    
    <!-- STUDY VIEW -->
    <section id="viewStudy" class="w-full h-full flex flex-col justify-between items-center overflow-visible">
      
      <!-- Card Stack Canvas -->
      <div class="relative w-full max-w-[280px] xs:max-w-[320px] ipadmini:max-w-[380px] ipad:max-w-[420px] aspect-[3/4] h-[50vh] xs:h-[54vh] ipadmini:h-[56vh] max-h-[460px] flex-grow mx-auto my-auto overflow-visible flex items-center justify-center">
        <div id="deck" class="relative w-full h-full overflow-visible">
          <!-- Dynamic card injections -->
        </div>
      </div>

      <!-- Action Buttons Block -->
      <div class="shrink-0 flex items-center justify-center gap-5 xs:gap-6 my-2 ipadmini:my-4">
        <button id="btnLeft" aria-label="À revoir" class="tactile-btn btn-revoir w-[52px] h-[52px] xs:w-[58px] xs:h-[58px] ipadmini:w-[62px] ipadmini:h-[62px]">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M1 4v6h6" />
            <path d="M3.5 15a9 9 0 1 0 2-9.7L1 10" />
          </svg>
        </button>
        
        <button id="btnFlip" aria-label="Retourner la carte" class="tactile-btn btn-flip w-[44px] h-[44px] xs:w-[48px] xs:h-[48px] ipadmini:w-[52px] ipadmini:h-[52px]">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 2l4 4-4 4" />
            <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
            <path d="M7 22l-4-4 4-4" />
            <path d="M21 13v1a4 4 0 0 1-4 4H3" />
          </svg>
        </button>
        
        <button id="btnRight" aria-label="Acquis" class="tactile-btn btn-acquis w-[52px] h-[52px] xs:w-[58px] xs:h-[58px] ipadmini:w-[62px] ipadmini:h-[62px]">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round">
            <path d="M20 6L9 17l-5-5" />
          </svg>
        </button>
      </div>
    </section>

    <!-- CARD CREATOR VIEW -->
    <section id="viewManage" class="hidden w-full h-full flex-col justify-center items-center overflow-visible my-auto">
      <div class="bg-white rounded-[28px] ipadmini:rounded-[36px] p-5 xs:p-6 shadow-md w-full max-w-[320px] xs:max-w-[340px] ipadmini:max-w-[420px] mx-auto">
        <h3 class="font-serif font-semibold text-base ipadmini:text-xl text-slate-800 mb-4 text-center">Nouvelle carte</h3>
        
        <div class="space-y-3 mb-5">
          <div>
            <label class="text-[9px] ipadmini:text-[10px] uppercase font-bold tracking-wider text-slate-400 block mb-1">Français</label>
            <input id="inFr" placeholder="ex: Fier" class="w-full text-xs ipadmini:text-sm rounded-xl px-3.5 py-2.5 bg-slate-100 border-0 focus:ring-2 focus:ring-[#4C599E] outline-none text-slate-800" autocomplete="off">
          </div>
          <div>
            <label class="text-[9px] ipadmini:text-[10px] uppercase font-bold tracking-wider text-slate-400 block mb-1">English</label>
            <input id="inEn" placeholder="ex: Proud" class="w-full text-xs ipadmini:text-sm rounded-xl px-3.5 py-2.5 bg-slate-100 border-0 focus:ring-2 focus:ring-[#4C599E] outline-none text-slate-800" autocomplete="off">
          </div>
        </div>

        <button id="btnAdd" disabled class="w-full py-3 bg-[#2C2830] text-white text-xs ipadmini:text-sm font-semibold rounded-xl hover:bg-slate-800 active:scale-95 transition-all disabled:opacity-35 disabled:cursor-not-allowed">
          Ajouter au jeu
        </button>
      </div>
    </section>

  </main>

  <!-- Notification Toast -->
  <div id="toast" class="toast"></div>

  <script>
    (() => {
      'use strict';
      
      const KEY = 'cartes-deck-v5';
      
      function uid() {
        return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
      }
      
      let state = { cards: [] };
      let queue = [];
      let flipped = false;
      let animating = false;

      const seed = [
        { fr: 'à gauche', en: 'to the left' },
        { fr: 'à droite', en: 'to the right' },
        { fr: 'tout droit', en: 'straight ahead' },
        { fr: 'en face de', en: 'across from' },
        { fr: 'à côté de', en: 'next to' },
        { fr: 'au coin de', en: 'at the corner of' },
        { fr: 'au bout de', en: 'at the end of' },
        { fr: 'vers', en: 'towards' },
        { fr: 'au-dessus de', en: 'above' },
        { fr: 'au-dessous de', en: 'below' },
        { fr: 'traverser', en: 'to cross' },
        { fr: 'faire demi-tour', en: 'to turn around' },
        { fr: 'fier / fière', en: 'proud' },
        { fr: 'déçu(e)', en: 'disappointed' },
        { fr: 'inquiet / inquiète', en: 'worried' },
        { fr: 'soulagé(e)', en: 'relieved' },
        { fr: 'gêné(e)', en: 'embarrassed' },
        { fr: 'épuisé(e)', en: 'exhausted' },
        { fr: 'agacé(e)', en: 'annoyed' },
        { fr: 'ravi(e)', en: 'delighted' },
        { fr: 'bouleversé(e)', en: 'deeply upset' },
        { fr: 'méfiant(e)', en: 'suspicious' },
        { fr: 'avoir hâte de', en: 'to look forward to' },
        { fr: 'en avoir marre de', en: 'to be fed up with' }
      ];

      const THEMES = ['blue', 'orange', 'sage', 'rose'];
      const SHAPES = ['shape-1', 'shape-2', 'shape-3', 'shape-4'];

      const memoryStorage = {
        _data: {},
        get: function(k) { return Promise.resolve({ value: this._data[k] || null }); },
        set: function(k, v) { this._data[k] = v; return Promise.resolve(); }
      };
      const getStorage = () => window.storage || memoryStorage;

      async function load() {
        try {
          const res = await getStorage().get(KEY);
          if (res && res.value) {
            state = JSON.parse(res.value);
          }
        } catch (e) {
          console.warn('Fallback storage active');
        }

        const have = new Set(state.cards.map(c => c.fr.trim().toLowerCase()));
        let added = false;
        seed.forEach(s => {
          if (!have.has(s.fr.trim().toLowerCase())) {
            state.cards.push({
              id: uid(),
              fr: s.fr,
              en: s.en,
              mastered: false
            });
            added = true;
          }
        });
        if (added) persist();
      }

      let saveTimer = null;
      function persist() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(async () => {
          try {
            await getStorage().set(KEY, JSON.stringify(state));
          } catch (e) {
            console.warn('Persistence save error', e);
          }
        }, 250);
      }

      const $ = id => document.getElementById(id);
      const deckEl = $('deck');

      function cardById(id) {
        return state.cards.find(c => c.id === id);
      }

      function learning() {
        return state.cards.filter(c => !c.mastered);
      }

      function toast(msg) {
        const t = $('toast');
        t.textContent = msg;
        t.className = "toast fixed left-1/2 -translate-x-1/2 bottom-12 bg-[#2C2830] text-white text-xs font-semibold px-5 py-2.5 rounded-full shadow-lg z-[9999] transition-all transform translate-y-0 opacity-100";
        clearTimeout(t._h);
        t._h = setTimeout(() => {
          t.className = "toast fixed left-1/2 -translate-x-1/2 bottom-12 bg-[#2C2830] text-white text-xs font-semibold px-5 py-2.5 rounded-full shadow-lg z-[9999] transition-all transform translate-y-4 opacity-0 pointer-events-none";
        }, 1800);
      }

      function rebuildQueue() {
        queue = learning().map(c => c.id);
        for (let i = queue.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [queue[i], queue[j]] = [queue[j], queue[i]];
        }
      }

      function getCardVisuals(id) {
        let code = 0;
        for (let i = 0; i < id.length; i++) {
          code += id.charCodeAt(i);
        }
        return {
          theme: THEMES[code % THEMES.length],
          shape: SHAPES[(code + 2) % SHAPES.length]
        };
      }

      function renderDeck(initial) {
        flipped = false;

        if (state.cards.length === 0) {
          deckEl.innerHTML = emptyHTML('☁︎', 'Aucune carte', 'Commencez à bâtir votre vocabulaire en ajoutant une carte.', 'goManage', 'Ajouter des cartes');
          hookEmpty();
          return;
        }

        if (queue.length === 0) {
          deckEl.innerHTML = emptyHTML('✿', 'Tout est acquis !', 'Vous avez maîtrisé toutes vos cartes.', 'restart', 'Réviser à nouveau');
          hookEmpty();
          return;
        }

        if (initial) {
          deckEl.innerHTML = '';
          const slice = queue.slice(0, 3);
          for (let i = slice.length - 1; i >= 0; i--) {
            const c = cardById(slice[i]);
            if (!c) continue;
            const el = buildCard(c);
            if (i === 1) el.className = 'fcard absolute inset-0 rounded-[32px] behind';
            if (i === 2) el.className = 'fcard absolute inset-0 rounded-[32px] behind2';
            if (i === 0) el.className = 'fcard absolute inset-0 rounded-[32px] z-20 entering';
            deckEl.appendChild(el);
          }
          attachDrag(deckEl.lastElementChild);
        }
      }

      function emptyHTML(glyph, title, body, action, label) {
        return `<div class="empty flex flex-col items-center justify-center text-center p-6 bg-white rounded-[32px] shadow-lg w-full h-full">
          <div class="glyph text-5xl text-[#E38379] mb-4">${glyph}</div>
          <h2 class="font-serif font-semibold text-xl text-slate-800 mb-2">${title}</h2>
          <p class="text-xs text-slate-500 max-w-[220px] mb-6 leading-relaxed">${body}</p>
          <button class="btn bg-[#2C2830] text-white text-xs font-semibold px-6 py-3 rounded-full hover:scale-105 active:scale-95 transition-all" data-action="${action}">${label}</button>
        </div>`;
      }

      function hookEmpty() {
        const b = deckEl.querySelector('[data-action]');
        if (!b) return;
        b.addEventListener('click', () => {
          if (b.dataset.action === 'goManage') {
            switchTab('manage');
          } else {
            state.cards.forEach(c => {
              c.mastered = false;
            });
            persist();
            rebuildQueue();
            renderDeck(true);
          }
        });
      }

      function buildCard(c) {
        const el = document.createElement('div');
        el.dataset.id = c.id;

        const visuals = getCardVisuals(c.id);

        el.innerHTML = `
          <div class="stamp acquis">acquis</div>
          <div class="stamp revoir">à revoir</div>
          <div class="card-inner">
            <!-- FRONT FACE: Pastel Exterior + Saturated Morphing Center Shape -->
            <div class="face front theme-light-${visuals.theme}">
              <div class="geo-shape ${visuals.shape} shape-saturated-${visuals.theme}">
                <div class="font-serif font-bold text-2xl xs:text-3xl ipadmini:text-4xl text-white text-center leading-tight">
                  ${escapeHTML(c.fr)}
                </div>
              </div>
            </div>
            
            <!-- BACK FACE: Saturated Exterior + Translucent Light Morphing Center Shape -->
            <div class="face back theme-${visuals.theme}">
              <div class="geo-shape ${visuals.shape}">
                <div class="translation font-serif font-bold text-2xl xs:text-3xl ipadmini:text-4xl text-white text-center leading-tight">
                  ${escapeHTML(c.en)}
                </div>
              </div>
            </div>
          </div>`;
        return el;
      }

      function escapeHTML(s) {
        return s.replace(/[&<>"']/g, m => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[m]));
      }

      function attachDrag(el) {
        if (!el) return;
        let startX = 0, startY = 0, dx = 0, dy = 0;
        let dragging = false, moved = false;

        const stampA = el.querySelector('.stamp.acquis');
        const stampR = el.querySelector('.stamp.revoir');

        const down = e => {
          if (animating) return;
          dragging = true;
          moved = false;
          startX = e.clientX;
          startY = e.clientY;
          el.setPointerCapture(e.pointerId);
          el.style.transition = 'none';
        };

        const move = e => {
          if (!dragging) return;
          dx = e.clientX - startX;
          dy = e.clientY - startY;

          if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;

          const rot = dx * 0.05;
          el.style.transform = `translate(${dx}px, ${dy * 0.3}px) rotate(${rot}deg)`;
          
          const progress = Math.min(Math.abs(dx) / 100, 1);
          if (dx > 0) {
            stampA.style.opacity = progress;
            stampR.style.opacity = 0;
          } else {
            stampR.style.opacity = progress;
            stampA.style.opacity = 0;
          }
        };

        const up = () => {
          if (!dragging) return;
          dragging = false;

          const threshold = Math.min(deckEl.offsetWidth * 0.32, 110);
          if (dx > threshold) {
            fly(el, 'right');
          } else if (dx < -threshold) {
            fly(el, 'left');
          } else {
            el.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.2)';
            el.style.transform = '';
            stampA.style.opacity = 0;
            stampR.style.opacity = 0;
            if (!moved) flipCard(el);
          }
          dx = 0; dy = 0;
        };

        el.addEventListener('pointerdown', down);
        el.addEventListener('pointermove', move);
        el.addEventListener('pointerup', up);
        el.addEventListener('pointercancel', up);
      }

      function flipCard(el) {
        el = el || deckEl.lastElementChild;
        if (!el) return;
        flipped = !flipped;
        el.classList.toggle('flipped', flipped);
      }

      function fly(el, dir) {
        if (animating) return;
        animating = true;

        const stamp = el.querySelector('.stamp.' + (dir === 'right' ? 'acquis' : 'revoir'));
        if (stamp) stamp.style.opacity = 1;
        el.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s';
        
        if (dir === 'right') {
          el.style.transform = 'translate(180vw, -10dvh) rotate(32deg)';
        } else {
          el.style.transform = 'translate(-180vw, -10dvh) rotate(-32deg)';
        }
        el.style.opacity = '0';
        
        const id = el.dataset.id;
        if (dir === 'right') {
          const c = cardById(id);
          if (c) {
            c.mastered = true;
            persist();
          }
          queue = queue.filter(q => q !== id);
        } else {
          queue = queue.filter(q => q !== id);
          queue.push(id);
        }

        const cardsInDom = Array.from(deckEl.querySelectorAll('.fcard'));
        const cardB = cardsInDom[cardsInDom.length - 2];
        const cardC = cardsInDom[cardsInDom.length - 3];

        if (cardB) {
          cardB.className = 'fcard absolute inset-0 rounded-[32px] z-20';
          cardB.style.transition = 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s';
          cardB.style.opacity = '';
          attachDrag(cardB);
        }
        
        if (cardC) {
          cardC.className = 'fcard absolute inset-0 rounded-[32px] behind';
          cardC.style.transition = 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s';
          cardC.style.opacity = '';
        }

        const nextSlice = queue.slice(0, 3);
        if (nextSlice.length >= 3) {
          const newCardId = nextSlice[2];
          const newCardData = cardById(newCardId);
          if (newCardData) {
            const newEl = buildCard(newCardData);
            newEl.className = 'fcard absolute inset-0 rounded-[32px] behind2';
            deckEl.insertBefore(newEl, deckEl.firstChild);
          }
        }

        setTimeout(() => {
          el.remove();
          animating = false;
          flipped = false;
          
          if (queue.length === 0 || state.cards.length === 0) {
            renderDeck(true);
          }
        }, 300);
      }

      function buttonSwipe(dir) {
        const el = deckEl.lastElementChild;
        if (!el || animating) return;
        el.style.transform = `translate(${dir === 'right' ? 30 : -30}px, -4px) rotate(${dir === 'right' ? 3 : -3}deg)`;
        requestAnimationFrame(() => fly(el, dir));
      }

      $('btnRight').addEventListener('click', () => buttonSwipe('right'));
      $('btnLeft').addEventListener('click', () => buttonSwipe('left'));
      $('btnFlip').addEventListener('click', () => flipCard());

      document.addEventListener('keydown', e => {
        if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowRight') buttonSwipe('right');
        if (e.key === 'ArrowLeft') buttonSwipe('left');
        if (e.key === ' ') {
          e.preventDefault();
          flipCard();
        }
      });

      const inFr = $('inFr'),
            inEn = $('inEn'),
            btnAdd = $('btnAdd');

      function validate() {
        btnAdd.disabled = !(inFr.value.trim() && inEn.value.trim());
      }

      inFr.addEventListener('input', validate);
      inEn.addEventListener('input', validate);

      [inFr, inEn].forEach(i => i.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !btnAdd.disabled) addCard();
      }));

      btnAdd.addEventListener('click', addCard);

      function addCard() {
        const c = {
          id: uid(),
          fr: inFr.value.trim(),
          en: inEn.value.trim(),
          mastered: false
        };
        state.cards.unshift(c);
        queue.unshift(c.id);
        persist();

        inFr.value = '';
        inEn.value = '';
        validate();
        inFr.focus();

        if (deckEl.querySelector('.empty')) renderDeck(true);
        toast('Carte ajoutée !');
      }

      function switchTab(which) {
        const study = which === 'study';
        
        const activeClass = 'flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-full transition-all bg-slate-900 text-white shadow-xs';
        const inactiveClass = 'flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-full transition-all text-slate-500 hover:text-slate-800';
        
        $('tabStudy').className = study ? activeClass : inactiveClass;
        $('tabManage').className = !study ? activeClass : inactiveClass;
        
        if (study) {
          $('viewStudy').classList.add('flex');
          $('viewStudy').classList.remove('hidden');
          $('viewManage').classList.add('hidden');
          $('viewManage').classList.remove('flex');
        } else {
          $('viewStudy').classList.remove('flex');
          $('viewStudy').classList.add('hidden');
          $('viewManage').classList.remove('hidden');
          $('viewManage').classList.add('flex');
        }
      }
      
      $('tabStudy').addEventListener('click', () => switchTab('study'));
      $('tabManage').addEventListener('click', () => switchTab('manage'));

      load().then(() => {
        rebuildQueue();
        renderDeck(true);
      });
    })();
  </script>
</body>

</html>

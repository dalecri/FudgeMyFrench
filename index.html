<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Cartes · Pixel French Flashcards</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Space Mono', 'monospace'],
            serif: ['Space Mono', 'monospace'],
          },
          screens: {
            'xs': '380px',
            'ipadmini': '768px',
            'ipad': '820px',
            'landscape-mobile': { 'raw': '(max-height: 500px) and (orientation: landscape)' }
          }
        }
      }
    }
  </script>

  <style>
    /* ============ THEME PRESETS (retro pixel palettes) ============ */
    :root, [data-theme="doux"] {
      /* Arcade — light, matches the reference: mint bg, white cards */
      --app-bg: #8FC79C;
      --paper: #FFFFFF;
      --card-front: #FFFFFF;
      --ink: #1D1D1D;
      --ink-soft: #52625A;

      --theme-blue-sat: #3A6CE0;
      --theme-orange-sat: #E2503B;
      --theme-sage-sat: #2B2B29;
      --theme-rose-sat: #8579EA;

      --card-border: #1A1917;
    }

    [data-theme="nuit"] {
      /* Night — dark neon arcade */
      --app-bg: #100F17;
      --paper: #1B1926;
      --card-front: #1B1926;
      --ink: #F1EFFB;
      --ink-soft: #9490B0;

      --theme-blue-sat: #3FD0F2;
      --theme-orange-sat: #FFC24B;
      --theme-sage-sat: #3FE08F;
      --theme-rose-sat: #FF5C9E;
    }

    [data-theme="vif"] {
      /* Game Boy — monochrome LCD green */
      --app-bg: #B7CB8B;
      --paper: #E6F0C9;
      --card-front: #E6F0C9;
      --ink: #24361D;
      --ink-soft: #55704A;

      --theme-blue-sat: #2E4A22;
      --theme-orange-sat: #55732C;
      --theme-sage-sat: #3D6B32;
      --theme-rose-sat: #6D8C44;
    }

    body {
      background-color: var(--app-bg);
      color: var(--ink);
      overflow: hidden;
      font-family: 'Space Mono', monospace;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      display: flex;
      flex-direction: column;
    }

    /* generic stepped pixel-corner cuts */
    .pixel-corner-sm {
      clip-path: polygon(
        0 6px, 6px 6px, 6px 0,
        calc(100% - 6px) 0, calc(100% - 6px) 6px, 100% 6px,
        100% calc(100% - 6px), calc(100% - 6px) calc(100% - 6px), calc(100% - 6px) 100%,
        6px 100%, 6px calc(100% - 6px), 0 calc(100% - 6px)
      );
    }
    .pixel-corner-lg {
      clip-path: polygon(
        0 14px, 14px 14px, 14px 0,
        calc(100% - 14px) 0, calc(100% - 14px) 14px, 100% 14px,
        100% calc(100% - 14px), calc(100% - 14px) calc(100% - 14px), calc(100% - 14px) 100%,
        14px 100%, 14px calc(100% - 14px), 0 calc(100% - 14px)
      );
    }

    /* ============ HEADER (auto-hide overlay) ============ */
    .app-header {
      position: relative;
      width: 100%;
      flex-shrink: 0;
      z-index: 50;
      padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      background: var(--paper);
      border-bottom: 4px solid var(--ink);
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-pixel {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 19px;
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-dot { width: 8px; height: 8px; }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      color: var(--ink-soft);
      border: 3px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform 0.08s steps(2), box-shadow 0.08s steps(2);
      touch-action: manipulation;
      flex-shrink: 0;
    }
    .icon-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }

    /* plain icon button, no background container (kept chrome-free per spec) */
    .icon-btn-plain {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--ink-soft);
      transition: transform 0.15s ease, color 0.2s ease;
      touch-action: manipulation;
      flex-shrink: 0;
    }
    .icon-btn-plain:active { transform: scale(0.88); }

    .lang-toggle-btn {
      height: 38px;
      padding: 0 13px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      color: var(--ink-soft);
      border: 3px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
      transition: transform 0.08s steps(2), box-shadow 0.08s steps(2);
      touch-action: manipulation;
      flex-shrink: 0;
    }
    .lang-toggle-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }

    /* ============ PROGRESS PILL ============ */
    .progress-pill {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--ink);
      background: var(--paper);
      border: 2.5px solid var(--ink);
      padding: 8px 16px;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
      white-space: nowrap;
    }
    .progress-pill { clip-path: polygon(
        0 6px, 6px 6px, 6px 0,
        calc(100% - 6px) 0, calc(100% - 6px) 6px, 100% 6px,
        100% calc(100% - 6px), calc(100% - 6px) calc(100% - 6px), calc(100% - 6px) 100%,
        6px 100%, 6px calc(100% - 6px), 0 calc(100% - 6px)
    ); }

    /* ============ MAIN STAGE ============ */
    .main-stage {
      flex: 1;
      min-height: 0;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 4vh, 34px);
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
    }

    #deckWrap {
      transition: height 0.35s cubic-bezier(0.16, 1, 0.3, 1), max-height 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .fcard {
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      perspective: 1500px;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .fcard.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 26px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 9px solid var(--card-border);
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.15), 0 10px 18px rgba(0, 0, 0, 0.18);
      transition: border-color 0.3s ease, background-color 0.3s ease, color 0.3s ease;
    }

    .face.front { transform: rotateY(0deg); z-index: 2; background: var(--card-front); }
    .face.back { transform: rotateY(180deg); z-index: 1; color: var(--paper); }

    .theme-blue { background-color: var(--theme-blue-sat); }
    .theme-orange { background-color: var(--theme-orange-sat); }
    .theme-sage { background-color: var(--theme-sage-sat); }
    .theme-rose { background-color: var(--theme-rose-sat); }

    .theme-light-blue { --suit-color: var(--theme-blue-sat); }
    .theme-light-orange { --suit-color: var(--theme-orange-sat); }
    .theme-light-sage { --suit-color: var(--theme-sage-sat); }
    .theme-light-rose { --suit-color: var(--theme-rose-sat); }
    .face.front { color: var(--suit-color); }

    .card-word {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: clamp(26px, 7.5vw, 42px);
      text-align: center;
      line-height: 1.2;
      padding: 0 30px;
      word-break: break-word;
    }

    .card-corner {
      position: absolute;
      display: flex;
      line-height: 0;
    }
    .corner-tl { top: 12px; left: 12px; }
    .corner-br { bottom: 12px; right: 12px; transform: rotate(180deg); }

    .fcard.behind {
      transform: scale(0.95) translateY(14px) rotate(-1deg);
      opacity: 1;
      pointer-events: none;
      z-index: 10;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s;
    }
    .fcard.behind2 {
      transform: scale(0.9) translateY(28px) rotate(1deg);
      opacity: 1;
      pointer-events: none;
      z-index: 5;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s;
    }
    /* face-down deck look for the stacked cards behind the active one */
    .fcard.behind::after,
    .fcard.behind2::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 6;
      border-radius: 26px;
      border: 9px solid var(--card-border);
      background-image: repeating-conic-gradient(var(--card-front) 0% 25%, color-mix(in srgb, var(--theme-blue-sat) 45%, var(--card-front)) 0% 50%);
      background-size: 22px 22px;
    }

    .fcard.entering {
      animation: cardEnter 0.35s steps(6);
    }
    @keyframes cardEnter {
      from { transform: scale(0.92) translateY(20px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }

    .stamp {
      position: absolute;
      bottom: 24px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 14px;
      border: 2px solid currentColor;
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
      z-index: 30;
      transition: opacity 0.1s ease;
    }
    .stamp.acquis { right: 24px; color: #1E4620; background-color: #E2F3E5; }
    .stamp.revoir { left: 24px; color: #611D24; background-color: #FCE8E9; }

    /* ============ BOTTOM SHEETS ============ */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(10, 8, 14, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .sheet-backdrop.visible { opacity: 1; pointer-events: auto; }

    .bottom-sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 70;
      background: var(--paper);
      color: var(--ink);
      border-radius: 14px 14px 0 0;
      border-top: 4px solid var(--ink);
      padding: 10px 22px calc(26px + env(safe-area-inset-bottom));
      max-height: 82vh;
      overflow-y: auto;
      transform: translateY(110%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .bottom-sheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 40px;
      height: 5px;
      background: var(--ink);
      opacity: 0.25;
      margin: 10px auto 18px;
    }

    .sheet-input {
      width: 100%;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      border-radius: 6px;
      padding: 12px 14px;
      background: var(--card-front);
      color: var(--ink);
      border: 2.5px solid var(--ink);
      outline: none;
    }
    .sheet-input:focus {
      box-shadow: 3px 3px 0 var(--theme-blue-sat);
    }
    .sheet-label {
      font-size: 9.5px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      display: block;
      margin-bottom: 6px;
    }
    .sheet-primary-btn {
      width: 100%;
      padding: 13px;
      background: var(--ink);
      color: var(--paper);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      border: 3px solid var(--ink);
      box-shadow: 4px 4px 0 color-mix(in srgb, var(--ink) 55%, transparent);
      transition: transform 0.08s steps(2), box-shadow 0.08s steps(2);
    }
    .sheet-primary-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 transparent; }
    .sheet-primary-btn:disabled { opacity: 0.35; }
    .sheet-secondary-btn {
      flex: 1;
      padding: 11px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      border: 2.5px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform 0.08s steps(2), box-shadow 0.08s steps(2);
    }
    .sheet-secondary-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
    .sheet-divider {
      height: 3px;
      background: var(--ink);
      opacity: 0.12;
      margin: 20px 0;
    }

    .theme-swatch {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px 8px;
      border-radius: 8px;
      background: var(--paper);
      border: 2.5px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform 0.08s steps(2), box-shadow 0.08s steps(2);
    }
    .theme-swatch.active {
      background: color-mix(in srgb, var(--ink) 8%, var(--paper));
    }
    .theme-swatch:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
    .swatch-dots { display: flex; gap: 3px; }
    .swatch-dots span { width: 10px; height: 10px; border-radius: 2px; display: block; }
    .theme-swatch-label {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .switch { position: relative; display: inline-block; width: 42px; height: 25px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch-track {
      position: absolute; inset: 0; cursor: pointer;
      background: var(--card-front);
      border: 2.5px solid var(--ink);
      border-radius: 8px;
      transition: background 0.2s ease;
    }
    .switch-track::before {
      content: "";
      position: absolute;
      width: 15px; height: 15px;
      left: 2px; top: 2px;
      background: var(--ink);
      border-radius: 3px;
      transition: transform 0.15s steps(3);
    }
    .switch input:checked + .switch-track::before { transform: translateX(17px); }

    .sheet-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .sheet-row-label { font-size: 13px; font-weight: 600; color: var(--ink); }
    .sheet-row-sub { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

    .toast {
      font-family: 'Space Mono', monospace;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.3);
      border: 2.5px solid rgba(0,0,0,0.15);
    }
  </style>
</head>

<body class="h-dvh w-screen relative select-none overflow-hidden">

  <!-- Auto-hiding header -->
  <header id="appHeader" class="app-header">
    <div class="header-top-row">
      <div class="brand brand-pixel" style="color: var(--ink);">
        Cartes
        <span class="brand-dot" style="background:var(--theme-rose-sat);"></span>
      </div>
      <div class="header-actions">
        <button id="btnCustomize" aria-label="Customize" class="icon-btn-plain">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="6" y1="4" x2="6" y2="20"></line>
            <line x1="12" y1="4" x2="12" y2="20"></line>
            <line x1="18" y1="4" x2="18" y2="20"></line>
            <circle cx="6" cy="9" r="2.2" fill="var(--paper)" stroke="currentColor" stroke-width="2"></circle>
            <circle cx="12" cy="15" r="2.2" fill="var(--paper)" stroke="currentColor" stroke-width="2"></circle>
            <circle cx="18" cy="7" r="2.2" fill="var(--paper)" stroke="currentColor" stroke-width="2"></circle>
          </svg>
        </button>
        <button id="btnLangToggle" aria-label="Toggle study direction" class="lang-toggle-btn">
          <span id="langToggleLabel">FR→EN</span>
        </button>
        <button id="btnOpenAdd" aria-label="Add a card" class="icon-btn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main study stage -->
  <main id="mainStage" class="main-stage">
    <div id="deckWrap" class="relative w-full max-w-[340px] xs:max-w-[400px] ipadmini:max-w-[460px] ipad:max-w-[500px] aspect-[3/4] h-[70vh] xs:h-[74vh] ipadmini:h-[76vh] max-h-[700px] overflow-visible flex items-center justify-center">
      <div id="deck" class="relative w-full h-full overflow-visible"></div>
    </div>

    <div id="progressPill" class="progress-pill">0 cards</div>
  </main>

  <!-- Shared backdrop for sheets -->
  <div id="sheetBackdrop" class="sheet-backdrop"></div>

  <!-- Add / Import / Export sheet -->
  <div id="addSheet" class="bottom-sheet">
    <div class="sheet-handle"></div>
    <h3 class="font-semibold text-lg text-center mb-5" style="color: var(--ink);">New card</h3>

    <div class="space-y-3 mb-4">
      <div>
        <label class="sheet-label">French</label>
        <input id="inFr" placeholder="e.g. Fier" class="sheet-input" autocomplete="off">
      </div>
      <div>
        <label class="sheet-label">English</label>
        <input id="inEn" placeholder="e.g. Proud" class="sheet-input" autocomplete="off">
      </div>
    </div>

    <button id="btnAdd" disabled class="sheet-primary-btn">Add to deck</button>

    <div class="sheet-divider"></div>

    <label class="sheet-label">Import / Export (JSON)</label>
    <p class="text-xs mb-3" style="color: var(--ink-soft);">A list of French / English pairs.</p>
    <div class="flex gap-3">
      <button id="btnImport" class="sheet-secondary-btn">Import</button>
      <button id="btnExport" class="sheet-secondary-btn">Export</button>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" class="hidden">
  </div>

  <!-- Customize sheet -->
  <div id="customizeSheet" class="bottom-sheet">
    <div class="sheet-handle"></div>
    <h3 class="font-semibold text-lg text-center mb-5" style="color: var(--ink);">Customize</h3>

    <label class="sheet-label">Theme</label>
    <div class="flex gap-3 mb-6">
      <button class="theme-swatch" data-theme="doux">
        <span class="swatch-dots">
          <span style="background:#3A6CE0"></span><span style="background:#E2503B"></span><span style="background:#2B2B29"></span><span style="background:#8579EA"></span>
        </span>
        <span class="theme-swatch-label">Arcade</span>
      </button>
      <button class="theme-swatch" data-theme="nuit">
        <span class="swatch-dots">
          <span style="background:#3FD0F2"></span><span style="background:#FFC24B"></span><span style="background:#3FE08F"></span><span style="background:#FF5C9E"></span>
        </span>
        <span class="theme-swatch-label">Night</span>
      </button>
      <button class="theme-swatch" data-theme="vif">
        <span class="swatch-dots">
          <span style="background:#2E4A22"></span><span style="background:#55732C"></span><span style="background:#3D6B32"></span><span style="background:#6D8C44"></span>
        </span>
        <span class="theme-swatch-label">Game Boy</span>
      </button>
    </div>

    <div class="sheet-divider"></div>

    <label class="sheet-label">Cloud sync (JSONBin.io)</label>
    <p class="text-xs mb-3" style="color: var(--ink-soft);">Free account at jsonbin.io &rarr; copy your API key. We'll create a bin for you the first time you connect.</p>
    <div class="space-y-2 mb-3">
      <input id="inApiKey" type="password" placeholder="API key (X-Master-Key)" class="sheet-input" autocomplete="off">
      <input id="inBinId" type="text" placeholder="Bin ID (auto-filled after connecting)" class="sheet-input" autocomplete="off">
    </div>
    <div class="flex gap-3 mb-3">
      <button id="btnConnectSync" class="sheet-secondary-btn">Connect</button>
      <button id="btnDisconnectSync" class="sheet-secondary-btn">Disconnect</button>
    </div>
    <p id="syncStatus" class="text-xs" style="color: var(--ink-soft);">Not connected — cards saved on this device only.</p>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    (() => {
      'use strict';

      function uid() {
        return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
      }

      let state = { cards: [], settings: { theme: 'doux', showButtons: true, frontLang: 'fr' } };
      let queue = [];
      let flipped = false;
      let animating = false;

      const seed = [
        { fr: 'à gauche', en: 'to the left' },
        { fr: 'à droite', en: 'to the right' },
        { fr: 'tout droit', en: 'straight ahead' },
        { fr: 'en face de', en: 'across from' },
        { fr: 'à côté de', en: 'next to' },
        { fr: 'au coin de', en: 'at the corner of' },
        { fr: 'au bout de', en: 'at the end of' },
        { fr: 'vers', en: 'towards' },
        { fr: 'au-dessus de', en: 'above' },
        { fr: 'au-dessous de', en: 'below' },
        { fr: 'traverser', en: 'to cross' },
        { fr: 'faire demi-tour', en: 'to turn around' },
        { fr: 'fier / fière', en: 'proud' },
        { fr: 'déçu(e)', en: 'disappointed' },
        { fr: 'inquiet / inquiète', en: 'worried' },
        { fr: 'soulagé(e)', en: 'relieved' },
        { fr: 'gêné(e)', en: 'embarrassed' },
        { fr: 'épuisé(e)', en: 'exhausted' },
        { fr: 'agacé(e)', en: 'annoyed' },
        { fr: 'ravi(e)', en: 'delighted' },
        { fr: 'bouleversé(e)', en: 'deeply upset' },
        { fr: 'méfiant(e)', en: 'suspicious' },
        { fr: 'avoir hâte de', en: 'to look forward to' },
        { fr: 'en avoir marre de', en: 'to be fed up with' }
      ];

      const THEMES = ['blue', 'orange', 'sage', 'rose'];
      const SHAPES = ['shape-1', 'shape-2', 'shape-3', 'shape-4'];

      /* ============ PIXEL SUIT ICONS ============ */
      const SUIT_BY_THEME = { blue: 'spade', orange: 'diamond', sage: 'club', rose: 'heart' };
      const SUIT_GRIDS = {
        heart:   ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'],
        diamond: ['...X...', '..XXX..', '.XXXXX.', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'],
        club:    ['..X.X..', '.XXXXX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '...X...', '..XXX..'],
        spade:   ['...X...', '..XXX..', '.XXXXX.', 'XXXXXXX', 'XXXXXXX', '..X.X..', '.XXXXX.']
      };
      function pixelSuitSVG(key, unit) {
        const grid = SUIT_GRIDS[key];
        const n = grid.length;
        let rects = '';
        grid.forEach((row, y) => {
          for (let x = 0; x < row.length; x++) {
            if (row[x] === 'X') rects += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
          }
        });
        return `<svg width="${unit}" height="${unit}" viewBox="0 0 ${n} ${n}" fill="currentColor" shape-rendering="crispEdges">${rects}</svg>`;
      }

      const CACHE_KEY = 'cartes-deck-cache-v1';
      const CONFIG_KEY = 'cartes-jsonbin-config-v1';
      const JSONBIN_BASE = 'https://api.jsonbin.io/v3/b';

      let syncConfig = { apiKey: '', binId: '' };

      function loadConfig() {
        try {
          const raw = localStorage.getItem(CONFIG_KEY);
          return raw ? JSON.parse(raw) : { apiKey: '', binId: '' };
        } catch (e) { return { apiKey: '', binId: '' }; }
      }
      function saveConfig(cfg) {
        try { localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg)); } catch (e) { /* ignore */ }
      }

      function cacheLocally() {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
      }
      function loadLocalCache() {
        try {
          const raw = localStorage.getItem(CACHE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (e) { return null; }
      }

      async function cloudLoad(cfg) {
        const res = await fetch(`${JSONBIN_BASE}/${cfg.binId}/latest`, {
          headers: { 'X-Master-Key': cfg.apiKey }
        });
        if (!res.ok) throw new Error('cloud load failed');
        const json = await res.json();
        return json.record;
      }
      async function cloudSave(cfg, data) {
        const res = await fetch(`${JSONBIN_BASE}/${cfg.binId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Master-Key': cfg.apiKey },
          body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error('cloud save failed');
      }
      async function cloudCreate(cfg, data) {
        const res = await fetch(JSONBIN_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Master-Key': cfg.apiKey, 'X-Bin-Name': 'cartes-deck' },
          body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error('cloud create failed');
        const json = await res.json();
        return json.metadata.id;
      }

      function setSyncStatus(s) {
        const el = document.getElementById('syncStatus');
        if (!el) return;
        const map = {
          idle: 'Not connected — cards saved on this device only.',
          syncing: 'Syncing…',
          synced: 'Synced to the cloud.',
          error: 'Sync error — check your API key and bin ID.'
        };
        el.textContent = map[s] || map.idle;
      }

      function seedIfEmpty() {
        if (state.cards.length > 0) return;
        seed.forEach(s => {
          state.cards.push({ id: uid(), fr: s.fr, en: s.en, mastered: false });
        });
      }

      async function load() {
        syncConfig = loadConfig();

        const cached = loadLocalCache();
        if (cached) {
          state.cards = cached.cards || [];
          state.settings = Object.assign({ theme: 'doux', showButtons: true, frontLang: 'fr' }, cached.settings || {});
        }

        if (syncConfig.apiKey && syncConfig.binId) {
          setSyncStatus('syncing');
          try {
            const cloud = await cloudLoad(syncConfig);
            if (cloud) {
              state.cards = cloud.cards || [];
              state.settings = Object.assign({ theme: 'doux', showButtons: true, frontLang: 'fr' }, cloud.settings || {});
            }
            setSyncStatus('synced');
          } catch (e) {
            setSyncStatus('error');
          }
        }

        seedIfEmpty();
        cacheLocally();
      }

      let saveTimer = null;
      function persist() {
        cacheLocally();
        clearTimeout(saveTimer);
        saveTimer = setTimeout(async () => {
          if (!syncConfig.apiKey || !syncConfig.binId) return;
          try {
            setSyncStatus('syncing');
            await cloudSave(syncConfig, state);
            setSyncStatus('synced');
          } catch (e) {
            setSyncStatus('error');
          }
        }, 700);
      }

      const $ = id => document.getElementById(id);
      const deckEl = $('deck');
      const progressPill = $('progressPill');
      const sheetBackdrop = $('sheetBackdrop');
      const addSheet = $('addSheet');
      const customizeSheet = $('customizeSheet');

      function cardById(id) { return state.cards.find(c => c.id === id); }
      function learning() { return state.cards.filter(c => !c.mastered); }

      function toast(msg) {
        const t = $('toast');
        t.textContent = msg;
        t.className = "toast fixed left-1/2 -translate-x-1/2 bottom-12 bg-[var(--ink)] text-[var(--paper)] text-xs font-semibold px-5 py-2.5 rounded-md z-[9999] transition-all transform translate-y-0 opacity-100";
        clearTimeout(t._h);
        t._h = setTimeout(() => {
          t.className = "toast fixed left-1/2 -translate-x-1/2 bottom-12 bg-[var(--ink)] text-[var(--paper)] text-xs font-semibold px-5 py-2.5 rounded-md z-[9999] transition-all transform translate-y-4 opacity-0 pointer-events-none";
        }, 1800);
      }

      /* ============ PROGRESS PILL ============ */
      function updateProgress() {
        const total = state.cards.length;
        if (total === 0) { progressPill.textContent = 'No cards'; return; }
        const mastered = state.cards.filter(c => c.mastered).length;
        const remaining = total - mastered;
        progressPill.textContent = `${mastered} mastered · ${remaining} learning`;
      }

      /* ============ DECK RENDERING ============ */
      function rebuildQueue() {
        queue = learning().map(c => c.id);
        for (let i = queue.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [queue[i], queue[j]] = [queue[j], queue[i]];
        }
      }

      function getCardVisuals(id) {
        let code = 0;
        for (let i = 0; i < id.length; i++) code += id.charCodeAt(i);
        return { theme: THEMES[code % THEMES.length], shape: SHAPES[(code + 2) % SHAPES.length] };
      }

      function renderDeck(initial) {
        flipped = false;
        updateProgress();

        if (state.cards.length === 0) {
          deckEl.innerHTML = emptyHTML('☁︎', 'No cards yet', 'Start building your vocabulary by adding a card.', 'openAdd', 'Add cards');
          hookEmpty();
          return;
        }

        if (queue.length === 0) {
          deckEl.innerHTML = emptyHTML('✿', 'All mastered!', "You've mastered every card.", 'restart', 'Study again');
          hookEmpty();
          return;
        }

        if (initial) {
          deckEl.innerHTML = '';
          const slice = queue.slice(0, 3);
          for (let i = slice.length - 1; i >= 0; i--) {
            const c = cardById(slice[i]);
            if (!c) continue;
            const el = buildCard(c);
            if (i === 1) el.className = 'fcard absolute inset-0 behind';
            if (i === 2) el.className = 'fcard absolute inset-0 behind2';
            if (i === 0) el.className = 'fcard absolute inset-0 z-20 entering';
            deckEl.appendChild(el);
          }
          attachDrag(deckEl.lastElementChild);
        }
      }

      function emptyHTML(glyph, title, body, action, label) {
        return `<div class="empty flex flex-col items-center justify-center text-center p-6 w-full h-full" style="background:var(--card-front); border:9px solid var(--card-border); border-radius:26px; box-shadow:0 8px 0 rgba(0,0,0,0.15), 0 10px 18px rgba(0,0,0,0.18);">
          <div class="glyph text-5xl mb-4" style="color:var(--theme-rose-sat);">${glyph}</div>
          <h2 class="font-semibold text-xl mb-2" style="color:var(--ink);">${title}</h2>
          <p class="text-xs max-w-[220px] mb-6 leading-relaxed" style="color:var(--ink-soft);">${body}</p>
          <button class="btn text-xs font-semibold px-6 py-3 rounded-md transition-all" style="background:var(--ink); color:var(--paper); border:2.5px solid var(--ink);" data-action="${action}">${label}</button>
        </div>`;
      }

      function hookEmpty() {
        const b = deckEl.querySelector('[data-action]');
        if (!b) return;
        b.addEventListener('click', () => {
          if (b.dataset.action === 'openAdd') {
            openSheet(addSheet);
          } else {
            state.cards.forEach(c => { c.mastered = false; });
            persist();
            rebuildQueue();
            renderDeck(true);
          }
        });
      }

      function buildCard(c) {
        const el = document.createElement('div');
        el.dataset.id = c.id;
        const visuals = getCardVisuals(c.id);
        const suitKey = SUIT_BY_THEME[visuals.theme];
        const frontText = state.settings.frontLang === 'fr' ? c.fr : c.en;
        const backText = state.settings.frontLang === 'fr' ? c.en : c.fr;
        const suitIcon = pixelSuitSVG(suitKey, 20);

        el.innerHTML = `
          <div class="stamp acquis">mastered</div>
          <div class="stamp revoir">review</div>
          <div class="card-inner">
            <div class="face front theme-light-${visuals.theme}">
              <span class="card-corner corner-tl">${suitIcon}</span>
              <span class="card-corner corner-br">${suitIcon}</span>
              <div class="card-word">${escapeHTML(frontText)}</div>
            </div>
            <div class="face back theme-${visuals.theme}">
              <span class="card-corner corner-tl">${suitIcon}</span>
              <span class="card-corner corner-br">${suitIcon}</span>
              <div class="card-word">${escapeHTML(backText)}</div>
            </div>
          </div>`;
        return el;
      }

      function escapeHTML(s) {
        return s.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
      }

      function attachDrag(el) {
        if (!el) return;
        let startX = 0, startY = 0, dx = 0, dy = 0;
        let dragging = false, moved = false;

        const stampA = el.querySelector('.stamp.acquis');
        const stampR = el.querySelector('.stamp.revoir');

        const down = e => {
          if (animating) return;
          dragging = true;
          moved = false;
          startX = e.clientX;
          startY = e.clientY;
          el.setPointerCapture(e.pointerId);
          el.style.transition = 'none';
        };

        const move = e => {
          if (!dragging) return;
          dx = e.clientX - startX;
          dy = e.clientY - startY;
          if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;

          const rot = dx * 0.05;
          el.style.transform = `translate(${dx}px, ${dy * 0.3}px) rotate(${rot}deg)`;

          const progress = Math.min(Math.abs(dx) / 100, 1);
          if (dx > 0) { stampA.style.opacity = progress; stampR.style.opacity = 0; }
          else { stampR.style.opacity = progress; stampA.style.opacity = 0; }
        };

        const up = () => {
          if (!dragging) return;
          dragging = false;
          const threshold = Math.min(deckEl.offsetWidth * 0.32, 110);
          if (dx > threshold) fly(el, 'right');
          else if (dx < -threshold) fly(el, 'left');
          else {
            el.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.2)';
            el.style.transform = '';
            stampA.style.opacity = 0;
            stampR.style.opacity = 0;
            if (!moved) flipCard(el);
          }
          dx = 0; dy = 0;
        };

        el.addEventListener('pointerdown', down);
        el.addEventListener('pointermove', move);
        el.addEventListener('pointerup', up);
        el.addEventListener('pointercancel', up);
      }

      function flipCard(el) {
        el = el || deckEl.lastElementChild;
        if (!el) return;
        flipped = !flipped;
        el.classList.toggle('flipped', flipped);
      }

      function fly(el, dir) {
        if (animating) return;
        animating = true;

        const stamp = el.querySelector('.stamp.' + (dir === 'right' ? 'acquis' : 'revoir'));
        if (stamp) stamp.style.opacity = 1;
        el.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s';

        if (dir === 'right') el.style.transform = 'translate(180vw, -10dvh) rotate(32deg)';
        else el.style.transform = 'translate(-180vw, -10dvh) rotate(-32deg)';
        el.style.opacity = '0';

        const id = el.dataset.id;
        if (dir === 'right') {
          const c = cardById(id);
          if (c) { c.mastered = true; persist(); }
          queue = queue.filter(q => q !== id);
        } else {
          queue = queue.filter(q => q !== id);
          queue.push(id);
        }
        updateProgress();

        const cardsInDom = Array.from(deckEl.querySelectorAll('.fcard'));
        const cardB = cardsInDom[cardsInDom.length - 2];
        const cardC = cardsInDom[cardsInDom.length - 3];

        if (cardB) {
          cardB.className = 'fcard absolute inset-0 z-20';
          cardB.style.transition = 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s';
          cardB.style.opacity = '';
          attachDrag(cardB);
        }
        if (cardC) {
          cardC.className = 'fcard absolute inset-0 behind';
          cardC.style.transition = 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s';
          cardC.style.opacity = '';
        }

        const nextSlice = queue.slice(0, 3);
        if (nextSlice.length >= 3) {
          const newCardData = cardById(nextSlice[2]);
          if (newCardData) {
            const newEl = buildCard(newCardData);
            newEl.className = 'fcard absolute inset-0 behind2';
            deckEl.insertBefore(newEl, deckEl.firstChild);
          }
        }

        setTimeout(() => {
          el.remove();
          animating = false;
          flipped = false;
          if (queue.length === 0 || state.cards.length === 0) renderDeck(true);
        }, 300);
      }

      function buttonSwipe(dir) {
        const el = deckEl.lastElementChild;
        if (!el || animating) return;
        el.style.transform = `translate(${dir === 'right' ? 30 : -30}px, -4px) rotate(${dir === 'right' ? 3 : -3}deg)`;
        requestAnimationFrame(() => fly(el, dir));
      }

      document.addEventListener('keydown', e => {
        if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowRight') buttonSwipe('right');
        if (e.key === 'ArrowLeft') buttonSwipe('left');
        if (e.key === ' ') { e.preventDefault(); flipCard(); }
      });

      /* ============ ADD CARD ============ */
      const inFr = $('inFr'), inEn = $('inEn'), btnAdd = $('btnAdd');

      function validate() { btnAdd.disabled = !(inFr.value.trim() && inEn.value.trim()); }
      inFr.addEventListener('input', validate);
      inEn.addEventListener('input', validate);
      [inFr, inEn].forEach(i => i.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !btnAdd.disabled) addCard();
      }));
      btnAdd.addEventListener('click', addCard);

      function addCard() {
        const c = { id: uid(), fr: inFr.value.trim(), en: inEn.value.trim(), mastered: false };
        state.cards.unshift(c);
        queue.unshift(c.id);
        persist();
        inFr.value = ''; inEn.value = '';
        validate();
        inFr.focus();
        if (deckEl.querySelector('.empty')) renderDeck(true);
        else updateProgress();
        toast('Card added!');
      }

      /* ============ IMPORT / EXPORT ============ */
      $('btnExport').addEventListener('click', () => {
        const data = state.cards.map(c => ({ fr: c.fr, en: c.en }));
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'cartes-export.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        toast('Export ready');
      });

      $('btnImport').addEventListener('click', () => $('importFile').click());
      $('importFile').addEventListener('change', async e => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          if (!Array.isArray(data)) throw new Error('format');
          const have = new Set(state.cards.map(c => c.fr.trim().toLowerCase()));
          let count = 0;
          data.forEach(item => {
            const fr = (item.fr || '').trim();
            const en = (item.en || '').trim();
            if (fr && en && !have.has(fr.toLowerCase())) {
              state.cards.push({ id: uid(), fr, en, mastered: false });
              have.add(fr.toLowerCase());
              count++;
            }
          });
          persist();
          rebuildQueue();
          renderDeck(true);
          toast(count > 0 ? `${count} card(s) imported` : 'No new cards');
        } catch (err) {
          toast('Invalid JSON file');
        }
        e.target.value = '';
      });

      /* ============ SHEETS ============ */
      function openSheet(el) {
        sheetBackdrop.classList.add('visible');
        el.classList.add('open');
      }
      function closeSheets() {
        addSheet.classList.remove('open');
        customizeSheet.classList.remove('open');
        sheetBackdrop.classList.remove('visible');
      }
      $('btnOpenAdd').addEventListener('click', () => openSheet(addSheet));
      $('btnCustomize').addEventListener('click', () => openSheet(customizeSheet));
      sheetBackdrop.addEventListener('click', closeSheets);

      /* ============ THEME + BUTTON VISIBILITY ============ */
      function applyTheme(name) {
        document.documentElement.setAttribute('data-theme', name);
        state.settings.theme = name;
        persist();
        document.querySelectorAll('.theme-swatch').forEach(b => b.classList.toggle('active', b.dataset.theme === name));
      }
      document.querySelectorAll('.theme-swatch').forEach(b => {
        b.addEventListener('click', () => applyTheme(b.dataset.theme));
      });

      /* ============ LANGUAGE DIRECTION TOGGLE ============ */
      function updateLangToggleLabel() {
        $('langToggleLabel').textContent = state.settings.frontLang === 'fr' ? 'FR→EN' : 'EN→FR';
      }
      function toggleFrontLang() {
        state.settings.frontLang = state.settings.frontLang === 'fr' ? 'en' : 'fr';
        persist();
        updateLangToggleLabel();
        renderDeck(true);
      }
      $('btnLangToggle').addEventListener('click', toggleFrontLang);

      /* ============ CLOUD SYNC UI ============ */
      const inApiKey = $('inApiKey'), inBinId = $('inBinId');

      $('btnConnectSync').addEventListener('click', async () => {
        const apiKey = inApiKey.value.trim();
        let binId = inBinId.value.trim();
        if (!apiKey) { toast('Enter your API key first'); return; }

        setSyncStatus('syncing');
        try {
          if (!binId) {
            binId = await cloudCreate({ apiKey }, state);
            inBinId.value = binId;
          } else {
            const cloud = await cloudLoad({ apiKey, binId });
            if (cloud && Array.isArray(cloud.cards)) {
              state.cards = cloud.cards;
              state.settings = Object.assign(state.settings, cloud.settings || {});
            } else {
              await cloudSave({ apiKey, binId }, state);
            }
          }
          syncConfig = { apiKey, binId };
          saveConfig(syncConfig);
          cacheLocally();
          rebuildQueue();
          renderDeck(true);
          applyTheme(state.settings.theme);
          updateLangToggleLabel();
          setSyncStatus('synced');
          toast('Connected!');
        } catch (e) {
          setSyncStatus('error');
          toast('Could not connect — check your key and bin ID');
        }
      });

      $('btnDisconnectSync').addEventListener('click', () => {
        syncConfig = { apiKey: '', binId: '' };
        saveConfig(syncConfig);
        inApiKey.value = '';
        inBinId.value = '';
        setSyncStatus('idle');
        toast('Disconnected — saving locally only');
      });

      load().then(() => {
        applyTheme(state.settings.theme);
        updateLangToggleLabel();
        inApiKey.value = syncConfig.apiKey || '';
        inBinId.value = syncConfig.binId || '';
        if (!syncConfig.apiKey || !syncConfig.binId) setSyncStatus('idle');
        rebuildQueue();
        renderDeck(true);
      });
    })();
  </script>
</body>
